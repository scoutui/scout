version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/deploy-docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
