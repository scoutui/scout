name: Consumer CI (cadence)

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly, on the default branch only
  workflow_dispatch:
    inputs:
      rescan:
        description: Scan and upload even when the dashboard already has the commit
        type: boolean
        default: false

permissions: {}

jobs:
  cadence:
    if: github.repository == 'scoutui/scout'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [pie-aperture, cal.diy, elk, vue-vben-admin, payload, ng-matero]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn turbo run build --filter=@scoutui/cli
      # Runs the target's own install and codegen, so it gets no secrets.
      - name: Clone and install (${{ matrix.target }})
        run: yarn workspace consumer-ci run cadence --target "$TARGET" --step prepare --work-dir "$RUNNER_TEMP/consumer-ci"
      - name: Scan and upload (${{ matrix.target }})
        env:
          SCOUTUI_HOST: ${{ secrets.SCOUTUI_HOST }}
          SCOUTUI_TOKEN_PIE_APERTURE_NEXTJS_APP_V14: ${{ matrix.target == 'pie-aperture' && secrets.SCOUTUI_TOKEN_PIE_APERTURE_NEXTJS_APP_V14 || '' }}
          SCOUTUI_TOKEN_PIE_APERTURE_NEXTJS_APP_V15: ${{ matrix.target == 'pie-aperture' && secrets.SCOUTUI_TOKEN_PIE_APERTURE_NEXTJS_APP_V15 || '' }}
          SCOUTUI_TOKEN_PIE_APERTURE_NUXT_APP: ${{ matrix.target == 'pie-aperture' && secrets.SCOUTUI_TOKEN_PIE_APERTURE_NUXT_APP || '' }}
          SCOUTUI_TOKEN_CAL_DIY_WEB: ${{ matrix.target == 'cal.diy' && secrets.SCOUTUI_TOKEN_CAL_DIY_WEB || '' }}
          SCOUTUI_TOKEN_ELK_ZONE_ELK: ${{ matrix.target == 'elk' && secrets.SCOUTUI_TOKEN_ELK_ZONE_ELK || '' }}
          SCOUTUI_TOKEN_VUE_VBEN_ADMIN: ${{ matrix.target == 'vue-vben-admin' && secrets.SCOUTUI_TOKEN_VUE_VBEN_ADMIN || '' }}
          SCOUTUI_TOKEN_PAYLOADCMS_PAYLOAD: ${{ matrix.target == 'payload' && secrets.SCOUTUI_TOKEN_PAYLOADCMS_PAYLOAD || '' }}
          SCOUTUI_TOKEN_NG_MATERO: ${{ matrix.target == 'ng-matero' && secrets.SCOUTUI_TOKEN_NG_MATERO || '' }}
          RESCAN: ${{ inputs.rescan }}
        run: |
          args=(--target "$TARGET" --step scan --work-dir "$RUNNER_TEMP/consumer-ci")
          if [ "$RESCAN" = "true" ]; then args+=(--rescan); fi
          yarn workspace consumer-ci run cadence "${args[@]}"
