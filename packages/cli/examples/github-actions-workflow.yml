name: scout

on:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx scout scan
        env:
          SCOUTUI_HOST: https://scout.example.com
          SCOUTUI_TOKEN: ${{ secrets.SCOUTUI_TOKEN }}
