suite: Worker identity isolation
release:
  name: cc
  namespace: default
values:
  - ../ci/test-values.yaml
templates:
  - configmap.yaml
  - deployment.yaml
  - worker-deployment.yaml
tests:
  - it: keeps Deployment names distinct for a maximum-length fullname ending in worker
    set:
      fullnameOverride: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-worker
    asserts:
      - equal:
          path: metadata.name
          value: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-worker
        template: deployment.yaml
      - notEqual:
          path: metadata.name
          value: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-worker
        template: worker-deployment.yaml
      - matchRegex:
          path: metadata.name
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
        template: worker-deployment.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: scout
            app.kubernetes.io/instance: cc
        template: deployment.yaml
      - notEqual:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: scout
        template: worker-deployment.yaml
  - it: excludes worker pods from the unchanged web selector for maximum-length name overrides
    set:
      nameOverride: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-worker
      fullnameOverride: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-worker
    asserts:
      - equal:
          path: metadata.name
          value: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-worker
        template: deployment.yaml
      - notEqual:
          path: metadata.name
          value: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-worker
        template: worker-deployment.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-worker
            app.kubernetes.io/instance: cc
        template: deployment.yaml
      - notEqual:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-worker
        template: worker-deployment.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-runner
            app.kubernetes.io/instance: cc
            app.kubernetes.io/component: worker
        template: worker-deployment.yaml
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-runner
            app.kubernetes.io/instance: cc
            app.kubernetes.io/component: worker
        template: worker-deployment.yaml
