apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scout.workerName" . }}
  labels:
    {{- include "scout.workerSelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "scout.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scout.workerSelectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "scout.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "scout.runnerImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "apps/web-app/worker.cjs"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: health
              containerPort: 3001
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "scout.databasePasswordSecretName" . }}
                  key: {{ include "scout.databasePasswordSecretKey" . }}
            - name: DATABASE_URL
              value: {{ include "scout.databaseUrl" . | quote }}
            - name: MIGRATE_ON_START
              value: {{ .Values.database.migrateOnStart | quote }}
            - name: WORKER_DATABASE_POOL_MAX
              value: {{ .Values.worker.databasePoolMax | quote }}
            - name: WORKER_HEALTH_PORT
              value: "3001"
            - name: WORKER_SHUTDOWN_TIMEOUT_MS
              value: {{ .Values.worker.shutdownTimeoutMs | quote }}
            {{- $heapMb := include "scout.workerNodeHeapMb" . | trim }}
            {{- if $heapMb }}
            - name: NODE_OPTIONS
              value: "--max-old-space-size={{ $heapMb }}"
            {{- end }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.worker.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            {{- toYaml .Values.worker.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.worker.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.worker.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.worker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- with .Values.worker.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
